<!doctype html>
<html lang="ru" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — чтобы вёрстка учитывала «чёлку» и жестовую полосу iPhone.
         Запрет масштабирования убран: он мешал людям со слабым зрением увеличить меню. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFBF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#FDFBF7" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <title>Домашняя кухня &amp; выпечка</title>
    <!-- Иконка вкладки. SVG берут современные браузеры, PNG и ICO — остальные. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="bingbot" content="noindex, nofollow" />
    <meta name="description" content="Домашняя кухня &amp; выпечка: пирожки, плацинды, пельмени и вареники ручной лепки, голубцы и праздничные блюда под заказ с удобным заказом в WhatsApp." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta property="og:title" content="Домашняя кухня &amp; выпечка" />
    <meta property="og:description" content="Пирожки, плацинды, пельмени и вареники ручной лепки, голубцы и праздничные блюда под заказ." />
    <meta property="og:type" content="website" />
  </head>
  <body class="bg-[#FAF7F2] text-[#2D241E] antialiased selection:bg-[#E8C5A5] selection:text-[#3B2516]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
